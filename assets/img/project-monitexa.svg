<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e33"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#1a273f" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- App Window Container -->
  <g filter="url(#shadow)" transform="translate(40, 35)">
    <!-- Window Frame -->
    <rect width="720" height="430" rx="14" fill="#0f192b" stroke="#1f2f4d" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="720" height="42" rx="14" fill="#132037"/>
    <rect y="28" width="720" height="14" fill="#132037"/>
    <line x1="0" y1="42" x2="720" y2="42" stroke="#1f2f4d" stroke-width="1"/>
    
    <!-- Window Dots -->
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>
    
    <!-- Search / Title Bar -->
    <rect x="220" y="11" width="280" height="20" rx="6" fill="#0b1322" stroke="#1e2c45" stroke-width="1"/>
    <text x="360" y="25" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="500">app.monitexa.internal / construction-dashboard</text>

    <!-- Sidebar -->
    <g transform="translate(0, 42)">
      <rect width="160" height="388" fill="#0e1728" stroke="#1f2f4d" stroke-width="1"/>
      <!-- Brand -->
      <text x="24" y="36" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">MONITEXA</text>
      <text x="100" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">PRO</text>
      
      <!-- Nav items -->
      <rect x="14" y="58" width="132" height="28" rx="6" fill="#172640"/>
      <circle cx="28" cy="72" r="4" fill="#00f2fe"/>
      <text x="42" y="76" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Dashboard</text>

      <circle cx="28" cy="110" r="3" fill="#64748b"/>
      <text x="42" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Proyek Aktif</text>

      <circle cx="28" cy="144" r="3" fill="#64748b"/>
      <text x="42" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Material &amp; RAB</text>

      <circle cx="28" cy="178" r="3" fill="#64748b"/>
      <text x="42" y="182" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Teknisi &amp; Tim</text>

      <circle cx="28" cy="212" r="3" fill="#64748b"/>
      <text x="42" y="216" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Laporan Fisik</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(180, 56)">
      <!-- Top Overview row -->
      <text x="0" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold">Manajemen Proyek Konstruksi</text>
      <text x="0" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Pemantauan real-time status fisik, logistik material, dan timeline kontraktor</text>

      <!-- KPI Stat Cards -->
      <g transform="translate(0, 52)">
        <!-- Card 1 -->
        <rect width="160" height="74" rx="8" fill="url(#cardGrad)" stroke="#1e2c45" stroke-width="1"/>
        <text x="14" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">TOTAL PROYEK</text>
        <text x="14" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold">18</text>
        <rect x="90" y="35" width="56" height="18" rx="4" fill="#00f2fe" fill-opacity="0.15"/>
        <text x="118" y="48" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+4 Bulan ini</text>

        <!-- Card 2 -->
        <rect x="175" y="0" width="160" height="74" rx="8" fill="url(#cardGrad)" stroke="#1e2c45" stroke-width="1"/>
        <text x="189" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">PROGRESS RATA-RATA</text>
        <text x="189" y="52" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold">78.4%</text>

        <!-- Card 3 -->
        <rect x="350" y="0" width="160" height="74" rx="8" fill="url(#cardGrad)" stroke="#1e2c45" stroke-width="1"/>
        <text x="364" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">STATUS LOGISTIK</text>
        <text x="364" y="52" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold">94% Aman</text>
      </g>

      <!-- Chart / Project List section -->
      <g transform="translate(0, 142)">
        <rect width="510" height="210" rx="10" fill="#111c30" stroke="#1f2f4d" stroke-width="1"/>
        <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">Progress Proyek Gedung Sentral Tahap II</text>
        <rect x="420" y="14" width="70" height="22" rx="4" fill="#00f2fe" fill-opacity="0.15"/>
        <text x="455" y="29" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ON TRACK</text>

        <!-- Gantt Progress Bars -->
        <!-- Task 1 -->
        <text x="20" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Pondasi &amp; Struktur Bawah</text>
        <rect x="180" y="54" width="310" height="14" rx="4" fill="#172640"/>
        <rect x="180" y="54" width="310" height="14" rx="4" fill="url(#accentGrad)"/>
        <text x="460" y="65" fill="#070c14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">100%</text>

        <!-- Task 2 -->
        <text x="20" y="100" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Pekerjaan Kolom &amp; Balok Lt. 1-4</text>
        <rect x="180" y="89" width="310" height="14" rx="4" fill="#172640"/>
        <rect x="180" y="89" width="260" height="14" rx="4" fill="url(#accentGrad)"/>
        <text x="410" y="100" fill="#070c14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">84%</text>

        <!-- Task 3 -->
        <text x="20" y="135" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Instalasi MEP &amp; Kelistrikan</text>
        <rect x="180" y="124" width="310" height="14" rx="4" fill="#172640"/>
        <rect x="180" y="124" width="160" height="14" rx="4" fill="#6366f1"/>
        <text x="310" y="135" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">52%</text>

        <!-- Task 4 -->
        <text x="20" y="170" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Finishing Fasad Eksterior</text>
        <rect x="180" y="159" width="310" height="14" rx="4" fill="#172640"/>
        <rect x="180" y="159" width="80" height="14" rx="4" fill="#06b6d4"/>
        <text x="230" y="170" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">26%</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="shadowPort" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradPort)"/>

  <!-- Code editor & Design preview composition -->
  <g filter="url(#shadowPort)" transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#0d1424" stroke="#1c2c47" stroke-width="1.5"/>

    <!-- Browser top bar -->
    <rect width="680" height="38" rx="14" fill="#111c30"/>
    <rect y="24" width="680" height="14" fill="#111c30"/>
    <line x1="0" y1="38" x2="680" y2="38" stroke="#1c2c47" stroke-width="1"/>
    <circle cx="25" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#eab308"/>
    <circle cx="59" cy="19" r="5" fill="#22c55e"/>
    <text x="340" y="23" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">ilham.dev / modern-portfolio-showcase</text>

    <!-- Content Grid -->
    <g transform="translate(30, 60)">
      <!-- Left side: Code snippet -->
      <rect width="280" height="310" rx="10" fill="#090e1a" stroke="#18253d" stroke-width="1"/>
      <text x="20" y="30" fill="#64748b" font-family="monospace" font-size="11">// developer.config.js</text>
      
      <text x="20" y="60" fill="#f43f5e" font-family="monospace" font-size="11">const <tspan fill="#00f2fe">developer</tspan> = {</text>
      <text x="36" y="85" fill="#94a3b8" font-family="monospace" font-size="11">name: <tspan fill="#a7f3d0">'Ilham Maulana'</tspan>,</text>
      <text x="36" y="110" fill="#94a3b8" font-family="monospace" font-size="11">role: <tspan fill="#a7f3d0">'Web Developer'</tspan>,</text>
      <text x="36" y="135" fill="#94a3b8" font-family="monospace" font-size="11">study: <tspan fill="#a7f3d0">'Sistem Informasi'</tspan>,</text>
      <text x="36" y="160" fill="#94a3b8" font-family="monospace" font-size="11">campus: <tspan fill="#a7f3d0">'UNPAM'</tspan>,</text>
      <text x="36" y="185" fill="#94a3b8" font-family="monospace" font-size="11">focus: [</text>
      <text x="52" y="210" fill="#a7f3d0" font-family="monospace" font-size="11">'Interactive Web',</text>
      <text x="52" y="235" fill="#a7f3d0" font-family="monospace" font-size="11">'System Architecture'</text>
      <text x="36" y="260" fill="#94a3b8" font-family="monospace" font-size="11">],</text>
      <text x="36" y="285" fill="#38bdf8" font-family="monospace" font-size="11">passion: <tspan fill="#f59e0b">'Clean &amp; Fast Code'</tspan></text>
      <text x="20" y="300" fill="#f43f5e" font-family="monospace" font-size="11">};</text>

      <!-- Right side: Portfolio Visual Cards -->
      <g transform="translate(300, 0)">
        <rect width="320" height="310" rx="10" fill="#0f192d" stroke="#1f3456" stroke-width="1"/>
        
        <!-- Header Tag -->
        <rect x="20" y="20" width="100" height="24" rx="4" fill="#00f2fe" fill-opacity="0.15"/>
        <text x="70" y="36" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">EDITORIAL UI</text>

        <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold">ILHAM MAULANA</text>
        <text x="20" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Interactive Web &amp; Systems Developer</text>

        <!-- Mini Feature Cards -->
        <rect x="20" y="125" width="280" height="50" rx="6" fill="#142138" stroke="#1e3252" stroke-width="1"/>
        <text x="36" y="154" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">✦</text>
        <text x="60" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">3D Interactive Lanyard</text>
        <text x="60" y="164" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Physics-inspired employee pass with photo</text>

        <rect x="20" y="185" width="280" height="50" rx="6" fill="#142138" stroke="#1e3252" stroke-width="1"/>
        <text x="36" y="214" fill="#6366f1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">✦</text>
        <text x="60" y="208" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Custom Cursor &amp; Smooth Flow</text>
        <text x="60" y="224" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Micro-interactions and editorial typography</text>

        <!-- Tech badges -->
        <g transform="translate(20, 255)">
          <rect width="60" height="24" rx="4" fill="#1e2c45"/>
          <text x="30" y="16" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">HTML5</text>

          <rect x="70" width="55" height="24" rx="4" fill="#1e2c45"/>
          <text x="97" y="16" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">CSS3</text>

          <rect x="135" width="75" height="24" rx="4" fill="#1e2c45"/>
          <text x="172" y="16" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">JavaScript</text>

          <rect x="220" width="60" height="24" rx="4" fill="#1e2c45"/>
          <text x="250" y="16" fill="#00f2fe" font-family="monospace" font-size="10" text-anchor="middle">Canvas</text>
        </g>
      </g>
    </g>
  </g>
</svg>

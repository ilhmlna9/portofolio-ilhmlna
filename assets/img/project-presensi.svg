<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadowP" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradP)"/>

  <!-- Subtle circles pattern -->
  <g stroke="#1a2d42" stroke-width="0.8" opacity="0.3">
    <circle cx="400" cy="250" r="160" fill="none"/>
    <circle cx="400" cy="250" r="280" fill="none"/>
  </g>

  <!-- App Window -->
  <g filter="url(#shadowP)" transform="translate(50, 40)">
    <rect width="700" height="420" rx="14" fill="#0c1624" stroke="#1d304a" stroke-width="1.5"/>

    <!-- Window bar -->
    <rect width="700" height="40" rx="14" fill="#122035"/>
    <rect y="26" width="700" height="14" fill="#122035"/>
    <line x1="0" y1="40" x2="700" y2="40" stroke="#1d304a" stroke-width="1"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#eab308"/>
    <circle cx="59" cy="20" r="5" fill="#22c55e"/>
    <text x="350" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">presensiku.internal / attendance-system</text>

    <!-- Header area -->
    <g transform="translate(25, 60)">
      <text x="0" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold">Presensiku — Sistem Presensi Karyawan</text>
      <text x="0" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Modul Absensi Mandiri, Shift Kerja, &amp; Rekapitulasi Presensi Terintegrasi</text>

      <!-- Today's Clock In Card -->
      <g transform="translate(0, 56)">
        <rect width="210" height="260" rx="10" fill="#111f33" stroke="#1f3654" stroke-width="1"/>
        <text x="20" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">STATUS HARI INI</text>
        <text x="20" y="60" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold">08:02 <tspan font-size="14" fill="#64748b">WIB</tspan></text>
        <rect x="20" y="76" width="90" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="65" y="91" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Tepat Waktu</text>

        <line x1="20" y1="115" x2="190" y2="115" stroke="#1c2d44" stroke-width="1"/>
        <text x="20" y="140" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">LOKASI GEOTAGGING</text>
        <text x="20" y="160" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">📍 Kantor Pusat, Lt. 3</text>
        <text x="20" y="178" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">-6.2918, 106.7139</text>

        <!-- Button Check Out -->
        <rect x="20" y="202" width="170" height="38" rx="6" fill="url(#tealGrad)"/>
        <text x="105" y="226" fill="#070c14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Presensi Pulang</text>
      </g>

      <!-- Attendance Table & Stats -->
      <g transform="translate(230, 56)">
        <rect width="420" height="260" rx="10" fill="#111f33" stroke="#1f3654" stroke-width="1"/>
        <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">Log Presensi Terkini</text>
        <text x="340" y="28" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Bulan Ini →</text>

        <!-- Table Header -->
        <rect x="20" y="44" width="380" height="28" rx="4" fill="#0d1829"/>
        <text x="32" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">NAMA PEGAWAI</text>
        <text x="160" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">JAM MASUK</text>
        <text x="250" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">SHIFT</text>
        <text x="340" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">STATUS</text>

        <!-- Rows -->
        <!-- Row 1 -->
        <text x="32" y="98" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">Ilham Maulana</text>
        <text x="160" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">08:02 WIB</text>
        <text x="250" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Reguler</text>
        <rect x="335" y="85" width="55" height="18" rx="3" fill="#10b981" fill-opacity="0.2"/>
        <text x="362" y="98" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Hadir</text>

        <line x1="20" y1="114" x2="400" y2="114" stroke="#18273d" stroke-width="1"/>

        <!-- Row 2 -->
        <text x="32" y="136" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">Ahmad Rizky</text>
        <text x="160" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">07:54 WIB</text>
        <text x="250" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Pagi</text>
        <rect x="335" y="123" width="55" height="18" rx="3" fill="#10b981" fill-opacity="0.2"/>
        <text x="362" y="136" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Hadir</text>

        <line x1="20" y1="152" x2="400" y2="152" stroke="#18273d" stroke-width="1"/>

        <!-- Row 3 -->
        <text x="32" y="174" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">Siti Nurhaliza</text>
        <text x="160" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">08:24 WIB</text>
        <text x="250" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Reguler</text>
        <rect x="335" y="161" width="55" height="18" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="362" y="174" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Telat</text>

        <line x1="20" y1="190" x2="400" y2="190" stroke="#18273d" stroke-width="1"/>

        <!-- Row 4 -->
        <text x="32" y="212" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">Dedi Setiawan</text>
        <text x="160" y="212" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">—</text>
        <text x="250" y="212" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Siang</text>
        <rect x="335" y="199" width="55" height="18" rx="3" fill="#6366f1" fill-opacity="0.2"/>
        <text x="362" y="212" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Izin</text>
      </g>
    </g>
  </g>
</svg>
